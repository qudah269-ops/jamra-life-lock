[project]
name = "jamra-life-lock"
version = "0.1.0"
description = "Drop lock for firefighting drones: no extinguisher ball over a person or an animal, and no drop when the camera is too dark to tell (NASA Space Apps 2026)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    # 1.23 is the last onnxruntime with Intel-Mac wheels
    "onnxruntime>=1.20,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pillow>=11.0",
]

[project.scripts]
jamra-life-lock = "jamra_life_lock.detect:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
